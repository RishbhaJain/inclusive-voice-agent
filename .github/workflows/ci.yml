name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install offline test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m spacy download en_core_web_sm

      - name: Run turn-taking regression evaluation
        run: PYTHONPATH=. python Tests/eval.py

      - name: Run grounded vehicle-context tests
        run: python -m pytest -q Tests/test_vehicle_context.py
